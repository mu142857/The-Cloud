// 11-12：加载文字与游戏使用同一个语言选择。没有手动设置时使用浏览器语言。
const cloudLanguages = ['en', 'zh', 'fr'];
function cloudBrowserLanguage() {
	const locale = (navigator.language || '').toLowerCase().split(/[-_]/)[0];
	return cloudLanguages.includes(locale) ? locale : 'en';
}
window.cloudGetLanguage = function () {
	try {
		const chosen = localStorage.getItem('theCloudLanguage');
		if (cloudLanguages.includes(chosen)) return chosen;
	} catch (e) { /* 浏览器禁用存储 */ }
	return cloudBrowserLanguage();
};
window.cloudRememberLanguage = function (language) {
	if (!cloudLanguages.includes(language)) return;
	try { localStorage.setItem('theCloudLanguage', language); } catch (e) { /* 浏览器禁用存储 */ }
	document.documentElement.lang = language;
	document.title = cloudBootStrings.title[cloudLanguages.indexOf(language)];
};

const cloudBootStrings = {
	title: ["The Cloud", "云", "Le Nuage"],
	subtitle: ["云", "THE CLOUD", "THE CLOUD"],
	canvas: ["Your browser does not support the canvas tag.", "这个浏览器不支持画布。", "Ce navigateur ne prend pas en charge l’élément canvas."],

	bootRetry: ["Could not start. Trying again…", "启动失败，自动重试一次……", "Le jeu n’a pas démarré. Nouvel essai…"],
	lowMemory: ["Not enough memory to start the game.\nClose other apps and reopen this page.\n", "手机内存不够，游戏没能启动。\n关掉后台的其他应用，退出这个页面再重新打开。\n", "Mémoire insuffisante pour lancer le jeu.\nFermez les autres applications et rouvrez cette page.\n"],
	loadFailed: ["Could not load the game. Close and reopen this page.\n", "加载失败，请退出后重新打开。\n", "Impossible de charger le jeu. Fermez et rouvrez cette page.\n"],
	reconnect: ["Connection stalled. Reconnecting…", "网络卡住了，正在重新连接……", "Connexion interrompue. Reconnexion…"],
	reconnectMany: ["Still reconnecting (attempt %d)…", "人有点多，还在重新连接（第 %d 次）……", "Reconnexion en cours (tentative %d)…"],
	slowBoot: ["Still starting the game…", "手机有点慢，正在启动……", "Le jeu est toujours en cours de démarrage…"],
	missingFeatures: ["This browser lacks features required to run the game:\n", "这个浏览器缺少运行游戏所需的功能：\n", "Ce navigateur ne dispose pas des fonctions nécessaires au jeu :\n"],
	starting: ["Download complete. Starting the game…", "下载好了，启动中……", "Téléchargement terminé. Démarrage du jeu…"],
	slowDownload: ["The download is taking a while. Please wait…", "网有点慢，再等等……", "Le téléchargement est lent. Patientez encore un peu…"],
	stalled: ["Download stalled (%s)", "下载卡住了（%s）", "Téléchargement interrompu (%s)"],
	connectError: ["no connection", "连不上", "connexion impossible"],
	noData: ["no data", "没数据", "aucune donnée reçue"],
	interrupted: ["connection stopped responding", "下到一半不动了", "la connexion ne répond plus"],
};
const cloudBootLanguage = window.cloudGetLanguage();
function cloudBootText(key) {
	return cloudBootStrings[key][cloudLanguages.indexOf(cloudBootLanguage)];
}
document.documentElement.lang = cloudBootLanguage;
document.title = cloudBootText('title');
document.getElementById('canvas').textContent = cloudBootText('canvas');
document.getElementById('status-title').textContent = cloudBootText('title');
document.getElementById('status-sub').textContent = cloudBootText('subtitle');
document.getElementById('rotate-tap').textContent = cloudBootText('rotate');
if (cloudBootLanguage !== 'zh') document.querySelector('#rotate img').hidden = true;

// B 站 App 里：页面跟着手机转、绝不沉浸（App 自己那条点赞、评论栏要留着，手册第一条）。
// Toy 的 SDK 会把这个告诉 App；不在 App 里时调用会被拒绝，无所谓。登录、关注、云存档、排行榜这版都没接。
(function () {
	const sdk = document.createElement('script');
	sdk.src = 'https://s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js';
	sdk.async = true;

// 版本号：export.sh 写进上面那个 span，游戏里 JavaScriptBridge.eval("window.cloudVersion || ''") 读出来显示
window.cloudVersion = document.getElementById('status-version').textContent;
window.cloudPhone = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)
	|| (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

// 固定渲染分辨率：导出预设 canvas_resize_policy=0，Godot 不动画布尺寸，画布永远 1440×810；
// 这里只按窗口大小等比缩放画布元素（CSS，四周黑边）。鼠标位置 Godot 按元素大小换算（canvas.width / rect.width），
// 所以元素本身要摆在内容的位置，不能用 object-fit。「全屏」改成整个页面全屏，照样走这里的缩放。
(function () {
	const CW = 1440, CH = 810;
	function fitCanvas() {
		const c = document.getElementById('canvas');
		if (!c) {
			return;
		}
		const vw = window.innerWidth, vh = window.innerHeight;
		const sc = Math.min(vw / CW, vh / CH);
		const w = Math.round(CW * sc), h = Math.round(CH * sc);
		c.style.width = w + 'px';
		c.style.height = h + 'px';
		c.style.left = Math.floor((vw - w) / 2) + 'px';
		c.style.top = Math.floor((vh - h) / 2) + 'px';
	}
	window.cloudFitCanvas = fitCanvas;
	window.addEventListener('resize', fitCanvas);
	window.addEventListener('orientationchange', fitCanvas);
	document.addEventListener('fullscreenchange', fitCanvas);
	document.addEventListener('webkitfullscreenchange', fitCanvas);
	function hookFullscreen() {
		const c = document.getElementById('canvas');
		if (!c) {
			return;
		}
		const root = document.documentElement;
		const req = root.requestFullscreen || root.webkitRequestFullscreen;
		if (req) {
			c.requestFullscreen = function () { return req.call(root); };
			c.webkitRequestFullscreen = c.requestFullscreen;
		}
		fitCanvas();
	}
	if (document.getElementById('canvas')) {
		hookFullscreen();
	} else {
		document.addEventListener('DOMContentLoaded', hookFullscreen);
	}
}());

// 加载界面的像素倍数（--s 进度条、--k 像素字）和竖屏提示：只是建议，点一下就消失、之后不再出现
(function () {
	const coarse = window.matchMedia ? window.matchMedia('(pointer: coarse)') : null;
	const note = document.getElementById('rotate');
	let dismissed = false;
	note.addEventListener('click', function () {
		dismissed = true;
		note.style.display = 'none';
	});
	function fit() {
		const dpr = window.devicePixelRatio || 1;
		const w = window.innerWidth;
		const h = window.innerHeight;
		const s = Math.max(1, Math.floor(Math.min(w / 480, h / 270) * dpr * 2)) / dpr;
		document.documentElement.style.setProperty('--s', String(s));
		// --k：一个游戏像素 = 多少 CSS 像素（整数个设备像素），像素字的字号按它乘，格子和游戏画面对齐
		const k = Math.max(1, Math.floor(Math.min(w / 480, h / 270) * dpr)) / dpr;
		document.documentElement.style.setProperty('--k', String(k));
		const upright = h > w && coarse !== null && coarse.matches;
		note.style.display = upright && !dismissed ? 'flex' : 'none';
	}
	window.addEventListener('resize', fit);
	window.addEventListener('orientationchange', fit);
	fit();
}());

// 引擎和资源包下的是 gz 版，这里边下边解压（手册附录 L）。Godot 的下载器按原文件名来要，按解压后的字节数算进度，进度照样准。
(function () {
	const PACKED = { 'index.wasm': 'index.wasm.gz.bin', 'index.pck': 'index.pck.gz.bin' };
	const TYPES = { 'index.wasm': 'application/wasm', 'index.pck': 'application/octet-stream' };
	if (typeof DecompressionStream !== 'function' || typeof ReadableStream !== 'function') {
		return;   // 旧浏览器：用原文件
	}
	const realFetch = window.fetch.bind(window);
	// 卡在 0%（寻找伪人 2026-10-15 玩家反馈）：请求挂着不回、或下到一半不动，Godot 的下载器只在「报错」时才重试。
	// 这里加时限：HEAD_WAIT 没回应、CHUNK_WAIT 没新数据就断掉报错，让 Godot 重下（最多 4 遍）。
	const HEAD_WAIT = 15000;
	const CHUNK_WAIT = 20000;
	function stalled(why) {
		const e = new Error(cloudBootText('stalled').replace('%s', why));
		e.stalled = true;
		if (typeof window.cloudNetRetry === 'function') {
			window.cloudNetRetry();
		}
		return e;
	}
	function within(promise, ms, why, ctl) {
		let timer = 0;
		const late = new Promise(function (resolve, reject) {
			timer = setTimeout(function () {
				reject(stalled(why));         // 先报「卡住」再断开：断开的错误后到，不会被当成别的错
				if (ctl) {
					ctl.abort();
				}
			}, ms);
		});
		return Promise.race([promise, late]).then(function (v) {
			clearTimeout(timer);
			return v;
		}, function (e) {
			clearTimeout(timer);
			throw e;
		});
	}
	window.fetch = function (input, init) {
		const url = typeof input === 'string' ? input : (input && input.url) || '';
		const name = url.split('?')[0].split('/').pop();
		if (!Object.prototype.hasOwnProperty.call(PACKED, name)) {
			return realFetch(input, init);
		}
		const packedUrl = url.replace(name, PACKED[name]);
		const ctl = typeof AbortController === 'function' ? new AbortController() : null;
		const opts = Object.assign({}, init || {}, ctl ? { signal: ctl.signal } : {});
		return within(realFetch(packedUrl, opts), HEAD_WAIT, cloudBootText('connectError'), ctl).then(function (res) {
			if (!res.ok || !res.body) {
				return realFetch(input, init);
			}
			// 服务器可能已经帮忙解压了（Content-Encoding）：先看前两个字节是不是 gzip 头
			const reader = res.body.getReader();
			return within(reader.read(), CHUNK_WAIT, cloudBootText('noData'), ctl).then(function (first) {
				const head = first.value || new Uint8Array(0);
				const gz = head.length >= 2 && head[0] === 0x1f && head[1] === 0x8b;
				let stream = new ReadableStream({
					start: function (controller) {
						if (head.length) {
							controller.enqueue(head);
						}
						if (first.done) {
							controller.close();
						}
					},
					pull: function (controller) {
						return within(reader.read(), CHUNK_WAIT, cloudBootText('interrupted'), ctl).then(function (r) {
							if (r.done) {
								controller.close();
							} else {
								controller.enqueue(r.value);
							}
						}, function (e) {
							controller.error(e);
						});
					},
				});
				if (gz) {
					stream = stream.pipeThrough(new DecompressionStream('gzip'));
				}
				return new Response(stream, { headers: { 'content-type': TYPES[name] } });
			});
		}).catch(function (e) {
			if (e && (e.stalled || e.name === 'AbortError')) {
				throw e;                      // 卡住的：交给 Godot 重下压缩包，别换成几十 MB 的原文件
			}
			return realFetch(input, init);
		});
	};
}());

// 加载到 100% 卡住：Godot 的 index.js 编译 wasm 只写了 .then、没接失败，编译失败（内存不够、解压的流断了）时界面永远停在 100%。
// 这里包一层：边下边编译失败就整块重下、再编译一次；还不行就在加载界面上报错（cloudBootFail，下面定义）。手册附录 N。
(function () {
	if (typeof WebAssembly !== 'object') {
		return;
	}
	const realStreaming = WebAssembly.instantiateStreaming;
	const realInstantiate = WebAssembly.instantiate;
	function report(e) {
		if (typeof window.cloudBootFail === 'function') {
			window.cloudBootFail(e);
		}
		throw e;
	}
	function again(imports) {
		return window.fetch('index.wasm', { cache: 'no-store' }).then(function (res) {
			return res.arrayBuffer();
		}).then(function (buf) {
			return realInstantiate.call(WebAssembly, buf, imports);
		});
	}
	if (typeof realStreaming === 'function') {
		WebAssembly.instantiateStreaming = function (source, imports) {
			return realStreaming.call(WebAssembly, source, imports).catch(function (e) {
				console.warn('wasm streaming failed, retrying', e);
				return again(imports);
			}).catch(report);
		};
	}
	WebAssembly.instantiate = function (source, imports) {
		const p = realInstantiate.call(WebAssembly, source, imports);
		return source instanceof WebAssembly.Module ? p : p.catch(report);
	};
}());

	const fill = document.getElementById('status-fill');
	const line = document.getElementById('status-line');
	const notice = document.getElementById('status-notice');
	const started = Date.now();

	// 启动失败先自动刷新重来一次；下载卡住时告诉玩家在重连；下完以后慢的手机提示一下，太久没反应就报超时。
	let failed = false;
	const TIMEOUT = cloudBootText('timeout');
	function fail(err) {
		if (failed) {
			return;
		}
		failed = true;
		console.error(err);
		const text = err instanceof Error ? err.message : (typeof err === 'string' ? err : cloudBootText('unknown'));
		// 启动失败（不是超时）先自动刷新重来一次：多是一时内存紧，换个干净的页面再编译常常就好了。只重来一次。
		let retried = false;
		try {
			retried = sessionStorage.getItem('cloudBootRetry') === '1';
			if (!retried && text !== TIMEOUT) {
				sessionStorage.setItem('cloudBootRetry', '1');
				line.textContent = cloudBootText('bootRetry');
				setTimeout(function () { location.reload(); }, 800);
				return;
			}
		} catch (e) { /* 存不了就不重试，直接报 */ }
		const memory = /memory|内存|allocat|oom/i.test(text);
		notice.textContent = (memory ? cloudBootText('lowMemory')
			: cloudBootText('loadFailed')) + text;
		notice.style.display = 'block';
		line.textContent = '';
	}
	window.cloudBootFail = fail;
	// 下载卡住、断开重下时（上面的 fetch 包装）：告诉玩家在重连，不是死了
	let netRetries = 0;
	window.cloudNetRetry = function () {
		netRetries += 1;
		if (!failed && fullAt === 0) {
			line.textContent = netRetries < 3 ? cloudBootText('reconnect') : cloudBootText('reconnectMany').replace('%d', netRetries);
		}
	};
	// 下载完以后还要在手机上编译、启动，慢的手机要十几秒：别让人以为卡死了。一直不动就提示退出重进。
	let fullAt = 0;
	let booted = false;
	const watch = setInterval(function () {
		if (booted || failed) {
			clearInterval(watch);
			return;
		}
		if (fullAt > 0 && Date.now() - fullAt > 60000) {
			clearInterval(watch);
			fail(TIMEOUT);
		} else if (fullAt > 0 && Date.now() - fullAt > 12000) {
			line.textContent = cloudBootText('slowBoot');
		}
	}, 1000);

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});
	if (missing.length !== 0) {
		fail(cloudBootText('missingFeatures') + missing.join('\n'));
		return;
	}
	engine.startGame({
		'onProgress': function (current, total) {
			if (failed) {
				return;   // 报错以后别再把下面那行字改回「启动中」
			}
			if (current > 0 && total > 0) {
				const pct = Math.min(1, current / total);
				fill.style.width = (pct * 100).toFixed(1) + '%';
				if (pct >= 1) {
					fullAt = fullAt || Date.now();
					line.textContent = cloudBootText('starting');
				} else if (Date.now() - started > 15000 && pct < 0.5) {
					line.textContent = cloudBootText('slowDownload');
				}
			}
		},
	}).then(function () {
		booted = true;
		try { sessionStorage.removeItem('cloudBootRetry'); } catch (e) { /* 无所谓 */ }
		status.remove();
		if (typeof window.cloudFitCanvas === 'function') {
			window.cloudFitCanvas();
		}
	}, function (err) {
		fail(err);
	});
}());
		</script>
	</body>
</html>
